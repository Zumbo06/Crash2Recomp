format_version = 5
id = "psx.enhancement.fast-loading"
version = "1.0.0"
name = "Fast Loading (host pacing)"
author = "psxrecomp"
description = "Runs loads faster on your PC without changing anything the game can notice."
resolver = "declarative"
save_compatibility = "shared"

# Loading speed is a property of the emulated hardware, not of any particular
# disc, so this ships with the framework and applies to every game.
[[target]]
game_id = "*"

[[feature]]
id = "fast-loading"
name = "Fast Loading (host pacing)"
description = "Off by default. The safe way to shorten loads: the game sees the same timing as on a console. The game also runs faster while a load is going on, which some speedrun routes avoid - speedrunners should use CD Speed instead."
group = "Quality of Life"
default_enabled = false

[[option]]
feature = "fast-loading"
id = "multiplier"
label = "Host speed multiplier"
description = "How much faster than normal a load may run. 1 is the original speed; 2 to 32 is the useful range. Ignored while Uncapped is on."
group = "Quality of Life"
type = "integer"
min = 1
max = 1024
step = 1
default = 4
disabled_by = "uncapped"

[[option]]
feature = "fast-loading"
id = "uncapped"
label = "Uncapped (as fast as your PC allows)"
description = "Runs loads as fast as this PC can, ignoring the multiplier above."
group = "Quality of Life"
type = "boolean"
default = "false"

[[plugin]]
feature = "fast-loading"
id = "psx.fast-loading"
