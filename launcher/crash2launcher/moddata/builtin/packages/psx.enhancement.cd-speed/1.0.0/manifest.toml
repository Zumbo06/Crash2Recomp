format_version = 5
id = "psx.enhancement.cd-speed"
version = "1.0.0"
name = "CD Speed"
author = "psxrecomp"
description = "Makes the emulated CD drive faster, so loads finish sooner. The game itself keeps its normal speed."
resolver = "declarative"
save_compatibility = "shared"

# Loading speed is a property of the emulated hardware, not of any particular
# disc, so this ships with the framework and applies to every game.
[[target]]
game_id = "*"

[[feature]]
id = "cd-speed"
name = "CD Speed"
description = "Off by default. The virtual CD reads faster while the game runs at its normal speed. Very high values can stall a load - if one does, lower the multiplier. Movies and CD music always play at normal speed."
group = "Quality of Life"
default_enabled = false

[[option]]
feature = "cd-speed"
id = "multiplier"
label = "CD speed multiplier"
description = "1 is the original speed. 2 to 32 is the useful range: higher loads faster but is more likely to stall. Ignored while Instant is on."
group = "Quality of Life"
type = "integer"
min = 1
max = 1024
step = 1
default = 4
disabled_by = "instant"

[[option]]
feature = "cd-speed"
id = "instant"
label = "Instant (fastest)"
description = "Reads as fast as possible instead of using the multiplier. The fastest setting, and the most likely to stall a load."
group = "Quality of Life"
type = "boolean"
default = "false"

[[option]]
feature = "cd-speed"
id = "instant_budget"
label = "Instant sectors per frame"
description = "How much Instant may read per frame. Lower it if loads stutter. Only used while Instant is on."
group = "Quality of Life"
type = "integer"
min = 1
max = 256
step = 1
default = 32

[[plugin]]
feature = "cd-speed"
id = "psx.cd-speed"
