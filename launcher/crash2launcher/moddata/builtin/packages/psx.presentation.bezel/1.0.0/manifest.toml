format_version = 5
id = "psx.presentation.bezel"
version = "1.0.0"
name = "Bezel Artwork"
author = "psxrecomp"
description = "Shows a picture of your choice in the bars beside or above the game image, instead of black."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "*"

[[feature]]
id = "bezel"
name = "Bezel Artwork"
description = "Off by default. Pick an image to fill the empty bars whenever the screen shape leaves some. Only what is drawn around the game changes."
group = "Visual"
default_enabled = false

[[resource]]
feature = "bezel"
id = "artwork"
label = "Bezel image"
description = "The picture to show in the bars around the game image."
format = "file"
file_patterns = "*.png,*.jpg,*.jpeg,*.bmp"
file_description = "Image files"
required = false

[[plugin]]
feature = "bezel"
id = "psx.bezel"
