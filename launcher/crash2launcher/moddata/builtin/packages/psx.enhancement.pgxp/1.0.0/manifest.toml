format_version = 5
id = "psx.enhancement.pgxp"
version = "1.0.0"
name = "PGXP Precision (geometry + textures)"
author = "psxrecomp"
description = "Stops 3D models wobbling and large floor and wall textures warping - the classic PS1 look. Visual only: gameplay is exactly as on a console."
resolver = "declarative"
save_compatibility = "shared"

# Sub-pixel precision is a property of the emulated GTE/GPU pair, not of any
# particular disc, so this ships with the framework and applies to every game.
[[target]]
game_id = "*"

[[feature]]
id = "pgxp"
name = "PGXP Precision"
description = "Off by default. Moves 3D corners by less than half a pixel and leaves 2D sprites and menus alone. Needs an internal resolution of 2x or higher to make a visible difference."
group = "Visual"
default_enabled = false

[[option]]
feature = "pgxp"
id = "cpu_mode"
label = "Track through CPU math"
description = "Also follows precision through the game's own arithmetic. Can fix more wobble in some games; safe either way."
group = "Visual"
type = "boolean"
default = "false"

[[plugin]]
feature = "pgxp"
id = "psx.pgxp"
